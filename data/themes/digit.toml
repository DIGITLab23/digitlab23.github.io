# Theme metadata
name = "DIGIT"

[light]
  # Primary
  primary = "#4f46e5"

  # Menu
  menu_primary = "#ffffff"
  menu_text = "#3f4354"
  menu_text_active = "#4f46e5"
  menu_title = "#0b0d14"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(248, 249, 252)"

[dark]
  # Primary
  primary = "#818cf8"

  link = "#a5b4fc"
  link_hover = "#67e8f9"

  # Menu
  menu_primary = "#0a0b10"
  menu_text = "rgba(255,255,255,0.65)"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Home sections
  background = "#0a0b10"
  home_section_odd = "#0a0b10"
  home_section_even = "#0e1018"
